name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish assets to (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

  build:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            zip_name: portrait-packager-windows-x86_64.zip
            binary_name: ppackage.exe
          - os: ubuntu-latest
            zip_name: portrait-packager-linux-x86_64.zip
            binary_name: ppackage
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Build binary
        run: python -m PyInstaller portrait-packager.spec

      - name: Package release zip
        shell: bash
        run: |
          mkdir -p release-staging/package
          cp "dist/${{ matrix.binary_name }}" "release-staging/package/${{ matrix.binary_name }}"
          cp config.example.yaml release-staging/package/config.yaml
          chmod +x "release-staging/package/${{ matrix.binary_name }}"
          cd release-staging/package
          zip -r "../${{ matrix.zip_name }}" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.zip_name }}
          path: release-staging/${{ matrix.zip_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: portrait-packager-windows-x86_64.zip
          path: release-assets

      - name: Download Linux package
        uses: actions/download-artifact@v4
        with:
          name: portrait-packager-linux-x86_64.zip
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.event.inputs.tag }}
          files: |
            release-assets/portrait-packager-windows-x86_64.zip
            release-assets/portrait-packager-linux-x86_64.zip
          generate_release_notes: true
