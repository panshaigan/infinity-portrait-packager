name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish assets to (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

  build:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: portrait-packager-windows-x86_64.exe
            dist_name: portrait-packager.exe
          - os: ubuntu-latest
            artifact_name: portrait-packager-linux-x86_64
            dist_name: portrait-packager
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Build binary
        run: python -m PyInstaller portrait-packager.spec

      - name: Prepare release asset
        shell: bash
        run: |
          mkdir -p release-staging
          cp "dist/${{ matrix.dist_name }}" "release-staging/${{ matrix.artifact_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release-staging/${{ matrix.artifact_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: portrait-packager-windows-x86_64.exe
          path: release-assets

      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: portrait-packager-linux-x86_64
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.event.inputs.tag }}
          files: |
            release-assets/portrait-packager-windows-x86_64.exe
            release-assets/portrait-packager-linux-x86_64
            config.example.yaml
          generate_release_notes: true
